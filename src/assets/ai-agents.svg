<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Agent Core Hexagon -->
  <polygon points="32,8 52,19 52,43 32,54 12,43 12,19" stroke="url(#aiGradient)" stroke-width="2.5" fill="rgba(121, 40, 202, 0.12)" />
  <polygon points="32,15 45,23 45,39 32,47 19,39 19,23" stroke="url(#glowGrad)" stroke-width="1.8" fill="rgba(0, 242, 254, 0.08)" stroke-dasharray="3 2"/>

  <!-- Neural Synapse Connections -->
  <line x1="32" y1="22" x2="32" y2="40" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="27" x2="40" y2="35" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="35" x2="40" y2="27" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Neural Nodes -->
  <circle cx="32" cy="31" r="5" fill="url(#aiGradient)" filter="url(#aiGlow)" />
  <circle cx="32" cy="22" r="3" fill="#00DFD8" />
  <circle cx="32" cy="40" r="3" fill="#00DFD8" />
  <circle cx="24" cy="27" r="3" fill="#FF0080" />
  <circle cx="40" cy="27" r="3" fill="#FF0080" />
  <circle cx="24" cy="35" r="3" fill="#7928CA" />
  <circle cx="40" cy="35" r="3" fill="#7928CA" />

  <!-- Outer Orbiting Intelligence Sparks -->
  <circle cx="32" cy="8" r="2.5" fill="#00F2FE" />
  <circle cx="52" cy="19" r="2.5" fill="#00F2FE" />
  <circle cx="52" cy="43" r="2.5" fill="#00F2FE" />
  <circle cx="32" cy="54" r="2.5" fill="#00F2FE" />
  <circle cx="12" cy="43" r="2.5" fill="#00F2FE" />
  <circle cx="12" cy="19" r="2.5" fill="#00F2FE" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ragGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>
    <linearGradient id="ragCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Vector Database Cylinder Bottom Layer -->
  <path d="M14 40 C14 44 22 47 32 47 C42 47 50 44 50 40 V45 C50 49 42 52 32 52 C22 52 14 49 14 45 Z" fill="url(#ragCore)" opacity="0.7"/>
  
  <!-- Vector Database Middle Layer -->
  <path d="M14 31 C14 35 22 38 32 38 C42 38 50 35 50 31 V36 C50 40 42 43 32 43 C22 43 14 40 14 36 Z" fill="url(#ragCore)" opacity="0.85"/>
  
  <!-- Vector Database Top Disk -->
  <ellipse cx="32" cy="27" rx="18" ry="6" fill="url(#ragGradient)" />

  <!-- Retrieval Query Ray / Vector Embedding -->
  <path d="M32 6 L32 24" stroke="url(#ragGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M27 19 L32 25 L37 19" stroke="url(#ragGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Sparkles -->
  <path d="M46 10 L48 15 L53 17 L48 19 L46 24 L44 19 L39 17 L44 15 Z" fill="#00F2FE" filter="url(#glow)"/>
  <path d="M16 16 L17.5 19.5 L21 21 L17.5 22.5 L16 26 L14.5 22.5 L11 21 L14.5 19.5 Z" fill="#00FF87" filter="url(#glow)"/>
</svg>

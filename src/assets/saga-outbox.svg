<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sagaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Outbox / Distributed State Box 1 -->
  <rect x="10" y="14" width="18" height="18" rx="4" fill="rgba(121, 40, 202, 0.2)" stroke="url(#boxGrad)" stroke-width="2" />
  <path d="M14 23 L18 27 L24 19" stroke="#00FF87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Outbox / Distributed State Box 2 -->
  <rect x="36" y="32" width="18" height="18" rx="4" fill="rgba(0, 242, 254, 0.2)" stroke="url(#sagaGrad)" stroke-width="2" />
  <path d="M40 41 L44 45 L50 37" stroke="#00FF87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Saga Orchestration / Transaction Flow Arrow -->
  <path d="M28 23 C34 23 34 32 36 32" stroke="url(#sagaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 2" />
  <path d="M36 28 L39 32 L34 34" fill="url(#sagaGrad)" />

  <!-- Compensation / Rollback Stream Curve (Saga characteristic) -->
  <path d="M36 41 C30 41 30 32 28 32" stroke="#FF0080" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231F20" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Background rounded card for contrast -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Kafka Stream Interconnections -->
  <line x1="32" y1="32" x2="47" y2="21" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="47" y2="43" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="17" y2="21" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="17" y2="43" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Kafka Nodes -->
  <circle cx="32" cy="32" r="6" fill="#FFFFFF" />
  <circle cx="47" cy="21" r="5" fill="#00F2FE" />
  <circle cx="47" cy="43" r="5" fill="#4FACFE" />
  <circle cx="17" cy="21" r="5" fill="#00F2FE" />
  <circle cx="17" cy="43" r="5" fill="#4FACFE" />
</svg>

      <stop offset="0%" stop-color="#FFA07A" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
